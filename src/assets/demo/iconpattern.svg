<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <pattern id="code-pattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <text x="10" y="30" font-family="monospace" font-size="18" font-weight="bold" fill="white"></></text>
      <text x="55" y="70" font-family="monospace" font-size="14" font-weight="bold" fill="white"></></text>
      <text x="5" y="85" font-family="monospace" font-size="11" font-weight="bold" fill="white"></></text>
      <text x="65" y="25" font-family="monospace" font-size="12" font-weight="bold" fill="white"></></text>
    </pattern>
    <pattern id="code-pattern-2" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <text x="5" y="45" font-family="monospace" font-size="16" font-weight="bold" fill="white"></></text>
      <text x="45" y="20" font-family="monospace" font-size="10" font-weight="bold" fill="white"></></text>
      <text x="30" y="75" font-family="monospace" font-size="13" font-weight="bold" fill="white"></></text>
    </pattern>
  </defs>
  <rect width="200" height="200" fill="url(#code-pattern)" />
  <rect width="200" height="200" fill="url(#code-pattern-2)" opacity="0.6" />
</svg>

