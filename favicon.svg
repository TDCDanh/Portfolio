<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Dark background matching --bg: #050a06 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a120b"/>
      <stop offset="100%" style="stop-color:#050a06"/>
    </linearGradient>
    <!-- Accent blue glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Subtle inner border glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#448AFF;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#2979FF;stop-opacity:0.12"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#bgGrad)"/>

  <!-- Subtle blue border -->
  <rect width="64" height="64" rx="14" ry="14" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Faint grid lines (2 horizontal, 2 vertical) matching site's hero grid motif -->
  <line x1="21" y1="0" x2="21" y2="64" stroke="#448AFF" stroke-width="0.4" stroke-opacity="0.07"/>
  <line x1="43" y1="0" x2="43" y2="64" stroke="#448AFF" stroke-width="0.4" stroke-opacity="0.07"/>
  <line x1="0" y1="21" x2="64" y2="21" stroke="#448AFF" stroke-width="0.4" stroke-opacity="0.07"/>
  <line x1="0" y1="43" x2="64" y2="43" stroke="#448AFF" stroke-width="0.4" stroke-opacity="0.07"/>

  <!-- Geometric "M" — angular, sharp, Syne-inspired, bold monogram -->
  <!-- Built from filled paths for a clean geometric look -->
  <path
    d="M12 48 L12 16 L19 16 L32 34 L45 16 L52 16 L52 48 L45 48 L45 26 L32 43 L19 26 L19 48 Z"
    fill="#448AFF"
    filter="url(#glow)"
  />

  <!-- Tiny accent dot bottom-right corner — adds personality -->
  <circle cx="54" cy="54" r="2.5" fill="#448AFF" opacity="0.5"/>
</svg>
